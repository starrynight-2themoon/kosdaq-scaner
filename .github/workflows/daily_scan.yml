name: Daily KOSDAQ Scanner Update

on:
  schedule:
    # 평일(월~금) UTC 06:45 = 한국시간(KST) 오후 3시 45분 자동 실행
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write # 생성된 index.html을 저장소에 자동 덮어쓰기 위한 권한

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install finance-datareader pandas tqdm beautifulsoup4 lxml plotly

      - name: 4. 스캐너 스크립트 실행 (HTML 생성)
        env:
          TZ: 'Asia/Seoul'
        run: |
          python jarvis_all_in_one.py

      - name: 5. 업데이트된 index.html 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KOSDAQ Scanner $(date +'%Y-%m-%d %H:%M')" && git push)
